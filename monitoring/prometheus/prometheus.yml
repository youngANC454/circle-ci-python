global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cicd-optimizer'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API
  - job_name: 'backend_api'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  # ML Engine
  - job_name: 'ml_engine'
    static_configs:
      - targets: ['ml_engine:8001']
    metrics_path: '/metrics'

  # Node Exporter (System Metrics)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # cAdvisor (Container Metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # MongoDB Exporter (if installed)
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb_exporter:9216']
    # Optional: uncomment if you add mongodb exporter
